
name: Publier le cours (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer les dépendances de calcul
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-build.txt
      - name: Préparer D3 local et les coordonnées UMAP
        run: python scripts/build_static_assets.py
      - name: Vérifier les ressources statiques
        run: |
          test -s assets/vendor/d3.v7.min.js
          test -s assets/js/manifold-data.js
          python scripts/check_static_site.py --require-prebuilt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
